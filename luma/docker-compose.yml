    file: ${APP_DATA_DIR}/data/config/production/device-user-root/duc-ca.crt
  duc_ca_key:
    file: ${APP_DATA_DIR}/data/config/production/device-user-root/duc-ca.key
  edge_ca_cert:
    file: ${APP_DATA_DIR}/data/config/production/edge-root/edge-ca.crt
  edge_server_cert:
    file: ${APP_DATA_DIR}/data/config/production/edge-server.crt
