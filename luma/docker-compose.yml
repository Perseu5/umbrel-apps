    - COSMOS_REGION=${COSMOS_REGION:-eastus}
    - COSMOS_REQUEST_TIMEOUT_MS=${COSMOS_REQUEST_TIMEOUT_MS:-15000}
    - COSMOS_REVISION=${LUMA_REVISION:-${LUMA_RELEASE_ID:-}}
    - COSMOS_SHUTDOWN_GRACE_MS=${COSMOS_SHUTDOWN_GRACE_MS:-5000}
    - COSMOS_STATE_DIR=/var/lib/cosmos
    - COSMOS_TRUST_DOMAIN=${COSMOS_TRUST_DOMAIN:-cosmos.local}
    - COSMOS_WORKLOAD=provisioning
    - LUMA_DEPLOYMENT_ENVIRONMENT=production
    - LUMA_PRODUCT=Luma
    - LUMA_RELEASE_ID=${LUMA_RELEASE_ID:-}
    - COSMOS_ALLOW_SINGLE_REPLICA_ENROLLMENT=1
    - COSMOS_DATABASE_URL=${COSMOS_DATABASE_URL:-}
    - COSMOS_DUC_CA_CERT=/etc/cosmos-duc/duc-ca.crt
    - COSMOS_DUC_CA_KEY=/etc/cosmos-duc/duc-ca.key
    - COSMOS_EDGE_TOKEN=${COSMOS_EDGE_TOKEN:-}
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 5s
      test:
      - CMD-SHELL
      - curl --fail --silent --show-error --output /dev/null http://127.0.0.1:18080/readyz && socat -T1 - TCP:127.0.0.1:15051
        </dev/null >/dev/null
      timeout: 3s
    image: ghcr.io/perseu5/luma-cosmos:0.3.29@sha256:548ef49d77bddfff2ba584700fa0d2627c086a73a50e84c35876527905867c14
    init: true
    labels:
      dk.andersmadsen.luma.component: cosmos
      dk.andersmadsen.luma.environment: ${LUMA_DEPLOYMENT_ENVIRONMENT:-production}
      dk.andersmadsen.luma.product: Luma
      dk.andersmadsen.luma.release: ${LUMA_RELEASE_ID:-}
      dk.andersmadsen.luma.workload: provisioning
      org.opencontainers.image.revision: ${LUMA_RELEASE_ID:-}
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    mem_limit: 768m
    networks:
      cosmos-internal: null
    pids_limit: 128
    profiles:
    - luma
    read_only: true
    restart: on-failure
    secrets:
    - mode: 292
      source: duc_ca_cert
      target: /etc/cosmos-duc/duc-ca.crt
    - mode: 292
      source: duc_ca_key
      target: /etc/cosmos-duc/duc-ca.key
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 7s
    tmpfs:
    - /tmp:size=16m,mode=1777
    volumes:
    - ${APP_DATA_DIR}/data/volumes/cosmos-state:/var/lib/cosmos
  searxng:
    cap_drop:
    - ALL
    environment:
      FORCE_OWNERSHIP: 'false'
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://127.0.0.1:8080/healthz
      timeout: 5s
    image: searxng/searxng@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
    labels:
      dk.andersmadsen.luma.component: search
      dk.andersmadsen.luma.environment: production
      dk.andersmadsen.luma.product: Luma
      dk.andersmadsen.luma.release: ${LUMA_RELEASE_ID:-}
      org.opencontainers.image.revision: ${LUMA_RELEASE_ID:-}
    mem_limit: 512m
    networks:
      search-egress:
        gw_priority: 1
      search-service: {}
    pids_limit: 128
    profiles:
    - luma
    read_only: true
    restart: on-failure
    secrets:
    - mode: 292
      source: searxng_settings
      target: /etc/searxng/settings.yml
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=64m,mode=1777,uid=977,gid=977
    - /var/cache/searxng:size=128m,mode=0750,uid=977,gid=977
    user: 977:977
  spotify-adapter:
    cap_drop:
    - ALL
    depends_on:
      center-iroh-bridge:
        condition: service_healthy
        required: true
    environment:
      LUMA_SPOTIFY_ADAPTER_BIND_ADDRESS: 0.0.0.0
      LUMA_SPOTIFY_ADAPTER_PORT: '18081'
      LUMA_SPOTIFY_ADAPTER_TIMEOUT_MS: ${LUMA_SPOTIFY_ADAPTER_TIMEOUT_MS:-10000}
      LUMA_SPOTIFY_ADAPTER_TOKEN_FILE: /run/secrets/spotify_adapter_token
      LUMA_SPOTIFY_ADAPTER_UPSTREAM_ORIGIN: http://center-iroh-bridge:18080
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - bun
      - --no-env-file
      - src/healthcheck.mjs
      timeout: 8s
    image: ghcr.io/perseu5/luma-spotify-adapter:0.3.29@sha256:8683cbd17adce9dc629ce2cea2279c343c44b9fc243330d833474aa763fa7c08
    labels:
      dk.andersmadsen.luma.component: spotify-adapter
      dk.andersmadsen.luma.environment: production
      dk.andersmadsen.luma.product: Luma
      dk.andersmadsen.luma.release: ${LUMA_RELEASE_ID:-}
      org.opencontainers.image.revision: ${LUMA_RELEASE_ID:-}
    mem_limit: 128m
    networks:
      pin-control: null
    pids_limit: 128
    profiles:
    - luma
    read_only: true
    restart: on-failure
    secrets:
    - mode: 292
      source: spotify_adapter_token
      target: /run/secrets/spotify_adapter_token
    security_opt:
    - no-new-privileges:true
  traefik:
    cap_add:
    - NET_BIND_SERVICE
    cap_drop:
    - ALL
    command:
    - --configFile=/etc/traefik/traefik.yml
    depends_on:
      center:
        condition: service_healthy
        required: true
      keycloak:
        condition: service_healthy
        required: true
      luma-init:
        condition: service_completed_successfully
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
      - CMD
      - traefik
      - healthcheck
      - --ping
      timeout: 5s
    image: traefik:v3.6.25@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    labels:
      dk.andersmadsen.luma.component: ingress
      dk.andersmadsen.luma.environment: production
      dk.andersmadsen.luma.product: Luma
      dk.andersmadsen.luma.release: ${LUMA_RELEASE_ID:-}
      org.opencontainers.image.revision: ${LUMA_RELEASE_ID:-}
    mem_limit: 256m
    networks:
      cosmos-internal: null
      lan-edge:
        ipv4_address: ${LUMA_DEVICE_EDGE_IPV4}
    pids_limit: 128
    restart: on-failure
    secrets:
    - mode: 292
      source: traefik_static
      target: /etc/traefik/traefik.yml
    - mode: 292
      source: traefik_dynamic
      target: /etc/traefik/dynamic/10-luma.yaml
    - source: traefik_extra
      target: /etc/traefik/dynamic/20-extra.yaml
      mode: 292
    security_opt:
    - no-new-privileges:true
    volumes:
    - ${APP_DATA_DIR}/data/volumes/traefik-acme:/var/lib/traefik
    - ${APP_DATA_DIR}/data/config/production/traefik-extra-certs:/etc/traefik/extra-certs:ro
    profiles:
    - luma
  luma-init:
    image: ghcr.io/perseu5/luma-umbrel:0.3.29@sha256:212d34fa13ef1851fcd14bfb431e15f74efd4844937ec85638f68043e0d13671
    profiles:
    - luma
    restart: 'no'
    user: 0:0
    command:
    - luma-umbrel
    - init
    environment:
      LUMA_VOLUME_OWNERS: '{"center-data":"1000:1001","cosmos-pgdata":"70:70","cosmos-state":"65532:65532","iroh-bridge-data":"65532:65532","keycloak-data":"1000:0","traefik-acme":"0:0"}'
    volumes:
    - ${APP_DATA_DIR}/data:/data
    network_mode: none
  portal:
    image: ghcr.io/perseu5/luma-umbrel:0.3.29@sha256:212d34fa13ef1851fcd14bfb431e15f74efd4844937ec85638f68043e0d13671
    restart: on-failure
    init: true
    user: 0:0
    command:
    - luma-umbrel
    - portal
    environment:
      LUMA_UMBREL_APP_ID: luma
      LUMA_UMBREL_DEVICE_DOMAIN: ${DEVICE_DOMAIN_NAME}
      LUMA_UMBREL_LAN_SUBNET: ${APP_LUMA_LAN_SUBNET}
      LUMA_UMBREL_HOST_IP: ${APP_LUMA_HOST_IP}
    volumes:
    - ${APP_DATA_DIR}/data:/data
  app_proxy:
    environment:
      APP_HOST: luma_portal_1
      APP_PORT: 8080
networks:
  cosmos-internal:
    internal: true
  pin-control:
    internal: true
  provider-egress: {}
  search-egress: {}
  search-service:
    internal: true
  lan-edge:
    driver: macvlan
    driver_opts:
      parent: ${APP_LUMA_LAN_PARENT}
    ipam:
      config:
      - subnet: ${APP_LUMA_LAN_SUBNET}
