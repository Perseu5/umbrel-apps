  traefik_dynamic:
    file: ${APP_DATA_DIR}/data/config/production/traefik-dynamic.yaml
  traefik_static:
    file: ${APP_DATA_DIR}/data/config/production/traefik.yaml
  traefik_extra:
    file: ${APP_DATA_DIR}/data/config/production/traefik-extra.json
